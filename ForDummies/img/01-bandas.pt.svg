<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="As quatro bandas desta máquina"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">As quatro bandas desta máquina</text>
<text x="20" y="51" class="st" text-anchor="start">Medidas, não estimadas de especificação. O PCIe é o elo mais lento.</text>
<text x="166" y="110" class="lb" text-anchor="end">VRAM (RTX 2060 S)</text>
<rect x="178" y="88" width="522.0" height="30" rx="4" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="710.0" y="109" class="numb" text-anchor="start">448 GB/s</text>
<text x="166" y="154" class="lb" text-anchor="end">RAM (DDR5-4800)</text>
<rect x="178" y="132" width="69.91071428571429" height="30" rx="4" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="257.9107142857143" y="153" class="numb" text-anchor="start">60,0 GB/s</text>
<text x="166" y="198" class="lb" text-anchor="end">Disco (RAID0 NVMe)</text>
<rect x="178" y="176" width="21.439285714285713" height="30" rx="4" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="209.43928571428572" y="197" class="numb" text-anchor="start">18,4 GB/s</text>
<text x="166" y="242" class="lb" text-anchor="end">PCIe gen 3 x16</text>
<rect x="178" y="220" width="13.982142857142858" height="30" rx="4" fill="var(--crit)" stroke="none" stroke-width="0"/>
<text x="201.98214285714286" y="241" class="numb" text-anchor="start">12,0 GB/s</text>
<line x1="178" y1="84" x2="178" y2="250" class="ln"/>
<text x="178" y="276" class="mu" text-anchor="start">banda de leitura sustentada (GB/s)</text>
<rect x="20" y="296" width="840" height="74" rx="10" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="38" y="320" class="lbb" text-anchor="start" fill="var(--crit)">A GPU só se alcança pelo PCIe: 12 GB/s.</text>
<text x="38" y="340" class="sm" text-anchor="start">Trazer peso da RAM para a GPU a cada token é 5× mais lento que</text>
<text x="38" y="358" class="sm" text-anchor="start">calcular na CPU. Medido: 0,054 tok/s contra 0,684 — 13× pior.</text>
</svg>
