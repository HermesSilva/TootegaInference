<text x="202" y="114.18181818181819" class="mu" text-anchor="end">20</text>
<text x="202" y="82" class="mu" text-anchor="end">tok/s</text>
<rect x="224" y="286.03636363636366" width="54" height="5.963636363636365" rx="4" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="251" y="278.03636363636366" class="numb" text-anchor="middle">0.66</text>
<text x="251" y="310" class="sm" text-anchor="middle">RAM 16 GB</text>
<rect x="298" y="285.6818181818182" width="54" height="6.318181818181818" rx="4" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="325" y="277.6818181818182" class="numb" text-anchor="middle">0.69</text>
<text x="325" y="310" class="sm" text-anchor="middle">RAM 30 GB</text>
<rect x="372" y="284.3727272727273" width="54" height="7.627272727272726" rx="4" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="399" y="276.3727272727273" class="numb" text-anchor="middle">0.84</text>
<text x="399" y="310" class="sm" text-anchor="middle">RAM 45 GB</text>
<rect x="446" y="283.55454545454546" width="54" height="8.445454545454545" rx="4" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="473" y="275.55454545454546" class="numb" text-anchor="middle">0.93</text>
<text x="473" y="310" class="sm" text-anchor="middle">RAM ~60 GB</text>
<line x1="534" y1="98" x2="534" y2="292" class="dash"/>
<rect x="566" y="152.72727272727272" width="54" height="139.27272727272728" rx="4" fill="var(--s3)" stroke="none" stroke-width="0"/>
<text x="593" y="144.72727272727272" class="numb" text-anchor="middle">15.3</text>
<text x="593" y="310" class="sm" text-anchor="middle">M1 today,</text>
<text x="593" y="323" class="sm" text-anchor="middle">ctx 1k</text>
<rect x="640" y="114.72727272727272" width="54" height="177.27272727272728" rx="4" fill="var(--s3)" stroke="none" stroke-width="0"/>
<text x="667" y="106.72727272727272" class="numb" text-anchor="middle">17-22</text>
<text x="667" y="310" class="sm" text-anchor="middle">4k target</text>
<line x1="210" y1="292" x2="770" y2="292" class="ln"/>
<text x="224" y="350" class="mu" text-anchor="start">same oversized model (744B), varying RAM</text>
<text x="550" y="350" class="mu" text-anchor="start">model that fits entirely (31.2B)</text>
<rect x="20" y="118" width="158" height="58" rx="8" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="32" y="138" class="sm" text-anchor="start">3.75x the RAM -&gt; 1.42x</text>
<text x="32" y="153" class="sm" text-anchor="start">(N^0.25)</text>
<rect x="20" y="190" width="158" height="58" rx="8" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="32" y="210" class="sm" text-anchor="start">changing regime -&gt; ~16x</text>
