<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="A token's journey, from text to text"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">A token's journey, from text to text</text>
<text x="20" y="51" class="st" text-anchor="start">Every generated token repeats the whole path. That is why cost is per token.</text>
<rect x="22" y="74" width="146" height="58" rx="8" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="95" y="99" class="lbb" text-anchor="middle">text</text>
<text x="95" y="117" class="monos" text-anchor="middle">What is the capital...</text>
<line x1="170" y1="103" x2="188" y2="103" class="ar"/>
<rect x="190" y="74" width="146" height="58" rx="8" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="263" y="99" class="lbb" text-anchor="middle">tokenizer</text>
<text x="263" y="117" class="monos" text-anchor="middle">BPE, 154,820 entries</text>
<line x1="338" y1="103" x2="356" y2="103" class="ar"/>
<rect x="358" y="74" width="146" height="58" rx="8" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="431" y="99" class="lbb" text-anchor="middle">ids</text>
<text x="431" y="117" class="monos" text-anchor="middle">[9061, 383, ...]</text>
<line x1="506" y1="103" x2="524" y2="103" class="ar"/>
<rect x="526" y="74" width="146" height="58" rx="8" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="599" y="99" class="lbb" text-anchor="middle">embed_tokens</text>
<text x="599" y="117" class="monos" text-anchor="middle">1 row of 2048 floats</text>
<line x1="674" y1="103" x2="692" y2="103" class="ar"/>
<rect x="694" y="74" width="146" height="58" rx="8" fill="var(--s2f)" stroke="var(--s2)" stroke-width="1.5"/>
<text x="767" y="99" class="lbb" text-anchor="middle">47 layers</text>
<text x="767" y="117" class="monos" text-anchor="middle">all the work: 2.01 GB</text>
<text x="767" y="129" class="monos" text-anchor="middle">read</text>
<rect x="22" y="196" width="146" height="58" rx="8" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="95" y="221" class="lbb" text-anchor="middle">final norm</text>
<text x="95" y="239" class="monos" text-anchor="middle">RMSNorm</text>
<line x1="170" y1="225" x2="188" y2="225" class="ar"/>
<rect x="190" y="196" width="146" height="58" rx="8" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="263" y="221" class="lbb" text-anchor="middle">lm_head</text>
<text x="263" y="239" class="monos" text-anchor="middle">2048 x 154,880</text>
<line x1="338" y1="225" x2="356" y2="225" class="ar"/>
<rect x="358" y="196" width="146" height="58" rx="8" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="431" y="221" class="lbb" text-anchor="middle">logits</text>
<text x="431" y="239" class="monos" text-anchor="middle">154,880 scores</text>
<line x1="506" y1="225" x2="524" y2="225" class="ar"/>
<rect x="526" y="196" width="146" height="58" rx="8" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="599" y="221" class="lbb" text-anchor="middle">sampling</text>
<text x="599" y="239" class="monos" text-anchor="middle">greedy / top-p / top-k</text>
<line x1="674" y1="225" x2="692" y2="225" class="ar"/>
<rect x="694" y="196" width="146" height="58" rx="8" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="767" y="221" class="lbb" text-anchor="middle">id -&gt; text</text>
<text x="767" y="239" class="monos" text-anchor="middle">Brasilia</text>
<path d="M 862 103 L 872 103 L 872 160 L 12 160 L 12 225 L 20 225" class="ar"/>
<path d="M 862 225 L 872 225 L 872 320 L 95 320 L 95 288" class="arS1"/>
<text x="430" y="336" class="sm" text-anchor="middle">the generated id feeds back as input for the next step (autoregressive)</text>
</svg>
