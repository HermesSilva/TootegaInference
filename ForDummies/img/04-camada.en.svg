<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" width="880" height="512" role="img" aria-label="Inside one layer"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">Inside one layer</text>
<text x="20" y="51" class="st" text-anchor="start">47 of them, one after another. Layer 0 is dense; layers 1 to 46 are MoE.</text>
<rect x="250" y="78" width="250" height="30" rx="6" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="375.0" y="98" class="sm" text-anchor="middle">input x  (2048 floats = 8 KB)</text>
<line x1="375.0" y1="108" x2="375.0" y2="124" class="ar"/>
<rect x="250" y="126" width="250" height="30" rx="6" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="375.0" y="146.0" class="lb" text-anchor="middle">RMSNorm</text>
<line x1="375.0" y1="156" x2="375.0" y2="172" class="ar"/>
<rect x="250" y="174" width="250" height="40" rx="6" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="375.0" y="199.0" class="lbb" text-anchor="middle">MLA attention</text>
<line x1="375.0" y1="214" x2="375.0" y2="230" class="ar"/>
<rect x="250" y="232" width="250" height="30" rx="6" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="375.0" y="252.0" class="lb" text-anchor="middle">+  residual</text>
<line x1="375.0" y1="262" x2="375.0" y2="278" class="ar"/>
<rect x="250" y="280" width="250" height="30" rx="6" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="375.0" y="300.0" class="lb" text-anchor="middle">RMSNorm</text>
<line x1="375.0" y1="310" x2="375.0" y2="326" class="ar"/>
<rect x="250" y="328" width="250" height="40" rx="6" fill="var(--s2f)" stroke="var(--s2)" stroke-width="1.5"/>
<text x="375.0" y="353.0" class="lbb" text-anchor="middle">MoE (router + 5 experts)</text>
<line x1="375.0" y1="368" x2="375.0" y2="384" class="ar"/>
<rect x="250" y="386" width="250" height="30" rx="6" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="375.0" y="406.0" class="lb" text-anchor="middle">+  residual</text>
<line x1="375.0" y1="416" x2="375.0" y2="432" class="ar"/>
<rect x="250" y="434" width="250" height="30" rx="6" fill="var(--neutral)" stroke="var(--axis)" stroke-width="1.5"/>
<text x="375.0" y="454" class="sm" text-anchor="middle">output x'  (2048 floats)</text>
<rect x="46" y="160" width="150" height="68" rx="8" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="121" y="178" class="sm" text-anchor="middle">KV cache</text>
<text x="121" y="193" class="sm" text-anchor="middle">576 values</text>
<text x="121" y="208" class="sm" text-anchor="middle">per token</text>
<path d="M 196 194 L 248 194" class="ar"/>
<text x="518" y="180" class="sm" text-anchor="start">looks backwards: reads the KV of</text>
<text x="518" y="194" class="sm" text-anchor="start">ALL previous positions</text>
<text x="518" y="334" class="sm" text-anchor="start">looks only at this token: picks 4</text>
<text x="518" y="348" class="sm" text-anchor="start">of 64 specialists</text>
<rect x="46" y="312" width="150" height="72" rx="8" fill="var(--warnf)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="121" y="332" class="sm" text-anchor="middle">layer 0: a plain</text>
<text x="121" y="346" class="sm" text-anchor="middle">10240 MLP goes here</text>
<text x="121" y="360" class="sm" text-anchor="middle">instead, with no</text>
<text x="121" y="374" class="sm" text-anchor="middle">router</text>
<path d="M 252 108 L 228 108 L 228 247 L 248 247" class="arS1"/>
<path d="M 252 262 L 228 262 L 228 401 L 248 401" class="arS1"/>
<text x="20" y="494" class="sm" text-anchor="start">residual: the input is added back - a layer corrects, it does not replace</text>
</svg>
