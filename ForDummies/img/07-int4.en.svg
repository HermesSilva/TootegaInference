<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-label="int4 on disk: two weights per byte, one scale per group"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">int4 on disk: two weights per byte, one scale per group</text>
<text x="20" y="51" class="st" text-anchor="start">64 weights become 32 bytes + 1 float. That is 0.5625 byte per weight.</text>
<text x="20" y="86" class="sm" text-anchor="start">group of 64 weights (along the input dimension)</text>
<rect x="20" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="20" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="43" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="20" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="31" y="116" class="monos" text-anchor="middle">w0</text>
<text x="54" y="116" class="monos" text-anchor="middle">w32</text>
<rect x="72" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="72" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="95" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="72" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="83" y="116" class="monos" text-anchor="middle">w1</text>
<text x="106" y="116" class="monos" text-anchor="middle">w33</text>
<rect x="124" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="124" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="147" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="124" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="135" y="116" class="monos" text-anchor="middle">w2</text>
<text x="158" y="116" class="monos" text-anchor="middle">w34</text>
<rect x="176" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="176" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="199" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="176" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="187" y="116" class="monos" text-anchor="middle">w3</text>
<text x="210" y="116" class="monos" text-anchor="middle">w35</text>
<rect x="228" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="228" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="251" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="228" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="239" y="116" class="monos" text-anchor="middle">w4</text>
<text x="262" y="116" class="monos" text-anchor="middle">w36</text>
<rect x="280" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="280" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="303" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="280" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="291" y="116" class="monos" text-anchor="middle">w5</text>
<text x="314" y="116" class="monos" text-anchor="middle">w37</text>
<rect x="332" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="332" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="355" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="332" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="343" y="116" class="monos" text-anchor="middle">w6</text>
<text x="366" y="116" class="monos" text-anchor="middle">w38</text>
<rect x="384" y="96" width="46" height="30" rx="4" fill="var(--surface)" stroke="var(--axis)" stroke-width="1.5"/>
<rect x="384" y="96" width="23" height="30" rx="0" fill="var(--s1f)" stroke="none" stroke-width="0"/>
<rect x="407" y="96" width="23" height="30" rx="0" fill="var(--s2f)" stroke="none" stroke-width="0"/>
<rect x="384" y="96" width="46" height="30" rx="4" fill="none" stroke="var(--axis)" stroke-width="1.5"/>
<text x="395" y="116" class="monos" text-anchor="middle">w7</text>
<text x="418" y="116" class="monos" text-anchor="middle">w39</text>
<text x="446" y="118" class="lb" text-anchor="start">...</text>
<text x="20" y="146" class="mu" text-anchor="start">32 bytes</text>
<rect x="500" y="96" width="130" height="30" rx="4" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="565" y="116" class="sm" text-anchor="middle">1 f32 scale</text>
<rect x="24" y="156" width="200" height="20" rx="4" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1"/>
<text x="232" y="171" class="sm" text-anchor="start">low nibble (bits 0-3)  -&gt;  weight j</text>
<rect x="24" y="182" width="200" height="20" rx="4" fill="var(--s2f)" stroke="var(--s2)" stroke-width="1"/>
<text x="232" y="197" class="sm" text-anchor="start">high nibble (bits 4-7)  -&gt;  weight j+32</text>
<text x="500" y="150" class="mono" text-anchor="start">real weight = (code - 8) x scale</text>
<text x="500" y="172" class="mono" text-anchor="start">code 0..15  -&gt;  -8..+7</text>
<rect x="20" y="220" width="410" height="96" rx="10" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="38" y="244" class="lbb" text-anchor="start" fill="var(--s3)">half/half (adopted)</text>
<text x="38" y="268" class="mono" text-anchor="start">v &amp; 0x0F  yields  w0..w31  contiguous</text>
<text x="38" y="290" class="mono" text-anchor="start">v &gt;&gt; 4    yields  w32..w63  contiguous</text>
<rect x="450" y="220" width="410" height="96" rx="10" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="468" y="244" class="lbb" text-anchor="start" fill="var(--crit)">even/odd (rejected)</text>
<text x="468" y="268" class="mono" text-anchor="start">v &amp; 0x0F  yields  w0, w2, w4, ...</text>
<text x="468" y="290" class="sm" text-anchor="start">forces a permutation of the activations</text>
<text x="20" y="348" class="sm" text-anchor="start">Nibble order does not change file size. It changes whether SIMD has to shuffle.</text>
</svg>
