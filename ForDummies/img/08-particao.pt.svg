<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Partição por camada: o peso mora, a ativação viaja"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">Partição por camada: o peso mora, a ativação viaja</text>
<text x="20" y="51" class="st" text-anchor="start">Cada camada calcula onde seus pesos já estão. Entre camadas passam 8 KB.</text>
<rect x="20" y="78" width="330" height="150" rx="10" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="36" y="102" class="lbb" text-anchor="start" fill="var(--s1)">GPU — VRAM 448 GB/s</text>
<rect x="36" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="1"/>
<rect x="86" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="1"/>
<rect x="136" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="1"/>
<rect x="186" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="1"/>
<rect x="236" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="1"/>
<rect x="286" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="1"/>
<text x="36" y="200" class="sm" text-anchor="start">camadas 0..k</text>
<rect x="530" y="78" width="330" height="150" rx="10" fill="var(--s2f)" stroke="var(--s2)" stroke-width="1.5"/>
<text x="546" y="102" class="lbb" text-anchor="start" fill="var(--s2)">CPU — RAM 60 GB/s</text>
<rect x="546" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s2)" stroke-width="1"/>
<rect x="596" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s2)" stroke-width="1"/>
<rect x="646" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s2)" stroke-width="1"/>
<rect x="696" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s2)" stroke-width="1"/>
<rect x="746" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s2)" stroke-width="1"/>
<rect x="796" y="118" width="42" height="60" rx="5" fill="var(--surface)" stroke="var(--s2)" stroke-width="1"/>
<text x="546" y="200" class="sm" text-anchor="start">camadas k+1..46</text>
<line x1="354" y1="148" x2="524" y2="148" class="ar"/>
<text x="439" y="132" class="sm" text-anchor="middle">8 KB de ativação por travessia</text>
<text x="439" y="170" class="mu" text-anchor="middle">PCIe 12 GB/s</text>
<text x="439" y="186" class="sm" text-anchor="middle">1,3 microssegundo</text>
<text x="439" y="200" class="sm" text-anchor="middle">por token.</text>
<text x="439" y="214" class="sm" text-anchor="middle">Irrelevante.</text>
<rect x="20" y="246" width="840" height="74" rx="10" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="38" y="270" class="lbb" text-anchor="start" fill="var(--crit)">O caminho errado (medido no engine anterior)</text>
<text x="38" y="292" class="sm" text-anchor="start">mover PESO para a GPU a cada camada, a cada token</text>
<text x="38" y="310" class="sm" text-anchor="start">4,7 MB por expert atravessando 12 GB/s  -&gt;  0,054 tok/s</text>
<text x="20" y="348" class="lbb" text-anchor="start">Lei de colocação: só vai para a GPU o que couber lá permanentemente.</text>
</svg>
