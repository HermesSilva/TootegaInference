<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Cache de prefixo: estável primeiro, volátil por último"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">Cache de prefixo: estável primeiro, volátil por último</text>
<text x="20" y="51" class="st" text-anchor="start">O KV é reaproveitado até o primeiro token diferente. Dali em diante, tudo é refeito.</text>
<text x="20" y="86" class="lbb" text-anchor="start" fill="var(--s3)">Ordem certa</text>
<rect x="20" y="96" width="126" height="40" rx="6" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="83.0" y="121" class="sm" text-anchor="middle">system</text>
<rect x="150" y="96" width="166" height="40" rx="6" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="233.0" y="121" class="sm" text-anchor="middle">ferramentas</text>
<rect x="320" y="96" width="226" height="40" rx="6" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="433.0" y="121" class="sm" text-anchor="middle">contexto longo</text>
<rect x="550" y="96" width="186" height="40" rx="6" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="643.0" y="121" class="sm" text-anchor="middle">histórico</text>
<rect x="740" y="96" width="106" height="40" rx="6" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="793.0" y="121" class="sm" text-anchor="middle">turno atual</text>
<text x="20" y="160" class="sm" text-anchor="start">92 de 100 tokens de prompt vieram do cache no 2º turno (medido)</text>
<text x="20" y="196" class="lbb" text-anchor="start" fill="var(--crit)">Ordem errada</text>
<rect x="20" y="206" width="126" height="40" rx="6" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="83.0" y="231" class="sm" text-anchor="middle">relógio</text>
<rect x="150" y="206" width="166" height="40" rx="6" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="233.0" y="231" class="sm" text-anchor="middle">system</text>
<rect x="320" y="206" width="226" height="40" rx="6" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="433.0" y="231" class="sm" text-anchor="middle">ferramentas</text>
<rect x="550" y="206" width="186" height="40" rx="6" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="643.0" y="231" class="sm" text-anchor="middle">contexto longo</text>
<rect x="740" y="206" width="106" height="40" rx="6" fill="var(--critf)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="793.0" y="231" class="sm" text-anchor="middle">turno</text>
<text x="20" y="270" class="sm" text-anchor="start">um timestamp na frente invalida os 100k tokens seguintes</text>
<rect x="560" y="300" width="60" height="16" rx="4" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1"/>
<text x="628" y="313" class="mu" text-anchor="start">reaproveitado do KV</text>
<rect x="560" y="322" width="60" height="16" rx="4" fill="var(--critf)" stroke="var(--crit)" stroke-width="1"/>
<text x="628" y="335" class="mu" text-anchor="start">recomputado</text>
<text x="20" y="312" class="sm" text-anchor="start">Um bloco de KV é endereçado pelo hash da sequência exata que o</text>
<text x="20" y="328" class="sm" text-anchor="start">produziu — nunca pelo slot, nunca pela posição.</text>
</svg>
