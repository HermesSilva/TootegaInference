<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="The ceiling: how much this machine can give"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">The ceiling: how much this machine can give</text>
<text x="20" y="51" class="st" text-anchor="start">Pure bytes-over-bandwidth. Ignores compute, kernel overhead and the serial chain.</text>
<line x1="90" y1="310.0" x2="710" y2="310.0" class="gl"/>
<text x="80" y="314.0" class="mu" text-anchor="end">0</text>
<line x1="90" y1="262.17391304347825" x2="710" y2="262.17391304347825" class="gl"/>
<text x="80" y="266.17391304347825" class="mu" text-anchor="end">10</text>
<line x1="90" y1="214.3478260869565" x2="710" y2="214.3478260869565" class="gl"/>
<text x="80" y="218.3478260869565" class="mu" text-anchor="end">20</text>
<line x1="90" y1="166.52173913043478" x2="710" y2="166.52173913043478" class="gl"/>
<text x="80" y="170.52173913043478" class="mu" text-anchor="end">30</text>
<line x1="90" y1="118.69565217391303" x2="710" y2="118.69565217391303" class="gl"/>
<text x="80" y="122.69565217391303" class="mu" text-anchor="end">40</text>
<text x="80" y="78" class="mu" text-anchor="end">tok/s</text>
<line x1="90.0" y1="310" x2="90.0" y2="315" class="ln"/>
<text x="90.0" y="330" class="mu" text-anchor="middle">1k</text>
<line x1="267.1428571428571" y1="310" x2="267.1428571428571" y2="315" class="ln"/>
<text x="267.1428571428571" y="330" class="mu" text-anchor="middle">4k</text>
<line x1="444.2857142857143" y1="310" x2="444.2857142857143" y2="315" class="ln"/>
<text x="444.2857142857143" y="330" class="mu" text-anchor="middle">16k</text>
<line x1="621.4285714285714" y1="310" x2="621.4285714285714" y2="315" class="ln"/>
<text x="621.4285714285714" y="330" class="mu" text-anchor="middle">64k</text>
<line x1="710.0" y1="310" x2="710.0" y2="315" class="ln"/>
<text x="710.0" y="330" class="mu" text-anchor="middle">128k</text>
<text x="710" y="348" class="mu" text-anchor="end">context (tokens)</text>
<line x1="90" y1="310" x2="710" y2="310" class="ln"/>
<polygon points="90.0,170.8 267.1,181.3 444.3,210.0 621.4,257.4 710.0,278.0 710.0,290.8 621.4,278.4 444.3,250.0 267.1,232.8 90.0,226.5" fill="var(--s1f)" stroke="none" opacity="0.85"/>
<polyline points="90.0,99.6 267.1,115.8 444.3,159.3 621.4,231.1 710.0,261.7" fill="none" stroke="var(--s2)" stroke-width="2" stroke-dasharray="6 4"/>
<polyline points="90.0,170.8 267.1,181.3 444.3,210.0 621.4,257.4 710.0,278.0" fill="none" stroke="var(--s1)" stroke-width="2"/>
<circle cx="90.0" cy="170.8" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="267.1" cy="181.3" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="444.3" cy="210.0" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="621.4" cy="257.4" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="710.0" cy="278.0" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="90.0" cy="99.6" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="267.1" cy="115.8" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="444.3" cy="159.3" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="621.4" cy="231.1" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="710.0" cy="261.7" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<text x="267.1428571428571" y="103.82608695652175" class="numb" text-anchor="middle" fill="var(--s2)">40.6</text>
<text x="267.1428571428571" y="169.34782608695653" class="numb" text-anchor="middle" fill="var(--s1)">26.9</text>
<text x="704.0" y="297.95652173913044" class="numb" text-anchor="end" fill="var(--s1)">6.7</text>
<rect x="730" y="96" width="8" height="8" rx="2" fill="var(--s1)" stroke="none" stroke-width="0"/>
<text x="746" y="104" class="sm" text-anchor="start">CPU only (60 GB/s)</text>
<rect x="730" y="140" width="8" height="8" rx="2" fill="var(--s2)" stroke="none" stroke-width="0"/>
<text x="746" y="148" class="sm" text-anchor="start">CPU+GPU 39%</text>
<text x="746" y="161" class="sm" text-anchor="start">(estimate)</text>
<rect x="730" y="190" width="8" height="8" rx="2" fill="var(--s1f)" stroke="var(--s1)" stroke-width="1"/>
<text x="746" y="198" class="sm" text-anchor="start">realistic band:</text>
<text x="746" y="211" class="sm" text-anchor="start">60-80% of the</text>
<text x="746" y="224" class="sm" text-anchor="start">ceiling</text>
<text x="20" y="356" class="mono" text-anchor="start">time per token = (2.01 GB of weights + 52.9 KB x context) / bandwidth</text>
<text x="20" y="380" class="sm" text-anchor="start">at 4k, KV is 10% of traffic</text>
<text x="430" y="380" class="sm" text-anchor="start">at 64k, KV is 63% - it takes over</text>
</svg>
