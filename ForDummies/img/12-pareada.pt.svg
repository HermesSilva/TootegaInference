<text x="36" y="300" class="sm" text-anchor="start">int4 &quot;melhor&quot; que BF16: -4,2%</text>
<text x="36" y="318" class="mu" text-anchor="start">depois +2,5%. O sinal virou ao dobrar a amostra.</text>
