</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">Por que a primeira medida deu o sinal invertido</text>
<text x="20" y="51" class="st" text-anchor="start">A perplexidade varia 223 a 473 entre janelas. Um efeito de 5% se afoga nisso.</text>
