<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" role="img" aria-label="O roadmap, com critério de saída em cada marco"><style>
  svg { --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
        --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
        --s1f:#e7f0fc; --s2f:#fdece5; --s3f:#e4f6ef; --critf:#fbeaea; --warnf:#fdf3dd;
        --neutral:#f0efec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70;
          --crit:#d03b3b; --good:#0ca30c; --warn:#fab219;
          --s1f:#152436; --s2f:#31180e; --s3f:#0f2a21; --critf:#331616; --warnf:#332a12;
          --neutral:#383835; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .t    { font-size:17px; font-weight:600; }
  .st   { font-size:12.5px; fill: var(--ink2); }
  .lb   { font-size:13px; }
  .lbb  { font-size:13px; font-weight:600; }
  .sm   { font-size:11.5px; fill: var(--ink2); }
  .mu   { font-size:11px; fill: var(--muted); }
  .num  { font-size:13px; font-variant-numeric: tabular-nums; }
  .numb { font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:12px; }
  .monos{ font-family: ui-monospace,"Cascadia Mono","Consolas",monospace; font-size:10.5px;
          fill: var(--ink2); }
  .ln   { stroke: var(--axis); stroke-width:1.5; fill:none; }
  .gl   { stroke: var(--grid); stroke-width:1; fill:none; }
  .ar   { stroke: var(--muted); stroke-width:2; fill:none; marker-end:url(#a); }
  .arS1 { stroke: var(--s1); stroke-width:2; fill:none; marker-end:url(#a1); }
  .arC  { stroke: var(--crit); stroke-width:2; fill:none; marker-end:url(#ac); }
  .dash { stroke: var(--muted); stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
</style><defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--crit)"/></marker>
</defs><rect width="100%" height="100%" fill="var(--surface)"/>
<text x="20" y="32" class="t" text-anchor="start">O roadmap, com critério de saída em cada marco</text>
<text x="20" y="51" class="st" text-anchor="start">Sem número, não fecha. Dois marcos têm critério de CORTE: se não pagar, é cancelado.</text>
<circle cx="46" cy="110" r="13" fill="var(--s3f)" stroke="var(--s3)" stroke-width="2"/>
<text x="46" y="115" class="sm" text-anchor="middle" fill="var(--s3)">M0</text>
<line x1="46" y1="124" x2="46" y2="136" class="gl"/>
<rect x="76" y="96" width="250" height="30" rx="6" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="90" y="116" class="lbb" text-anchor="start">converter e validar</text>
<text x="346" y="116" class="sm" text-anchor="start">container int4 + perplexidade medida</text>
<text x="840" y="116" class="sm" text-anchor="end" fill="var(--s3)">feito</text>
<circle cx="46" cy="150" r="13" fill="var(--s3f)" stroke="var(--s3)" stroke-width="2"/>
<text x="46" y="155" class="sm" text-anchor="middle" fill="var(--s3)">M1</text>
<line x1="46" y1="164" x2="46" y2="176" class="gl"/>
<rect x="76" y="136" width="250" height="30" rx="6" fill="var(--s3f)" stroke="var(--s3)" stroke-width="1.5"/>
<text x="90" y="156" class="lbb" text-anchor="start">forward CPU, token-exato</text>
<text x="346" y="156" class="sm" text-anchor="start">32/32 no oráculo e &gt;= 10 tok/s a 4k</text>
<text x="840" y="156" class="sm" text-anchor="end" fill="var(--s3)">feito</text>
<circle cx="46" cy="190" r="13" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
<text x="46" y="195" class="sm" text-anchor="middle" fill="var(--muted)">M2</text>
<line x1="46" y1="204" x2="46" y2="216" class="gl"/>
<rect x="76" y="176" width="250" height="30" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>
<text x="90" y="196" class="lb" text-anchor="start">partição GPU/CPU</text>
<text x="346" y="196" class="sm" text-anchor="start">&gt;= 20% sobre o M1, senão CANCELA</text>
<circle cx="46" cy="230" r="13" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
<text x="46" y="235" class="sm" text-anchor="middle" fill="var(--muted)">M3</text>
<line x1="46" y1="244" x2="46" y2="256" class="gl"/>
<rect x="76" y="216" width="250" height="30" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>
<text x="90" y="236" class="lb" text-anchor="start">servidor e batching</text>
<text x="346" y="236" class="sm" text-anchor="start">K=4 rende &gt;= 2,5x o K=1</text>
<circle cx="46" cy="270" r="13" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
<text x="46" y="275" class="sm" text-anchor="middle" fill="var(--muted)">M4</text>
<line x1="46" y1="284" x2="46" y2="296" class="gl"/>
<rect x="76" y="256" width="250" height="30" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>
<text x="90" y="276" class="lb" text-anchor="start">CLI agêntico</text>
<text x="346" y="276" class="sm" text-anchor="start">acerto de cache &gt;= 90%, abertura quente &lt;= 3 s</text>
<circle cx="46" cy="310" r="13" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/>
<text x="46" y="315" class="sm" text-anchor="middle" fill="var(--muted)">M5</text>
<rect x="76" y="296" width="250" height="30" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>
<text x="90" y="316" class="lb" text-anchor="start">otimizar, com número</text>
<text x="346" y="316" class="sm" text-anchor="start">cada item com antes/depois</text>
<text x="20" y="340" class="mu" text-anchor="start">M0 + M1 feito  |  M2 à frente</text>
</svg>
